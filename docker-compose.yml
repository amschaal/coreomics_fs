version: "3.9"

services:
  py-app:
    build: .
    # Mount the current folder so you can edit files locally and see changes instantly.
    # Remove the volume line if you prefer the container to use only the copied files.
    volumes:
      - .:/app
    # Keep the container alive with an interactive terminal.
    stdin_open: true # equivalent to -i
    tty: true # equivalent to -t
    networks:
      - shared-network
    ports:
      - "443"
networks:
  shared-network: #for communicating with other docker application APIs used by plugins.  First run: docker network create shared-network
    external: true
