[paths]
; where <year>/<month>/<ID> lives
canonical_root = /data/projects
; top-level view container
views_root = /data/views
; version folder name
submissions_db_directory = /data/.submissions_db
date_format = %%Y_%%m_%%d
; per-run log file (inside version dir)
log_name = build.log
; per-run error log (inside version dir)
error_log = error.log  
; share subdirectory - if not blank, create in canonical directory, write README.md inside, and use for path when sharing data
share_subdirectory = share
; Optional parallel views tree of Windows .lnk shortcuts, for SMB clients on
; Windows (which can't follow POSIX symlinks). Blank = feature off. Same view
; structure as views_root, but each project leaf is a <id>.lnk shortcut into the
; canonical tree. MUST be disjoint from canonical_root and views_root.
; Requires the 'pylnk3' package on the build host (pip install pylnk3).
windows_views_root =
; How the .lnk leaves address canonical: "unc" (an absolute \\server\share\...
; path; works regardless of which drive letter each user maps) or "drive" (a
; mapped drive letter, e.g. Z:\... ; only works if everyone maps the same letter).
windows_views_target = unc
; The server-side directory that the Windows share/drive maps to. Must be an
; ancestor of canonical_root. Used to rewrite canonical paths to Windows paths.
; e.g. if the [proteomics] share's path = /data, set this to /data.
windows_server_path =
; UNC base (the \\server\share root), used when windows_views_target = unc.
windows_unc_base =
; Mapped drive letter, used when windows_views_target = drive.
windows_drive_letter =

[api]
api_key = API_KEY_HERE
api_base_url = my.submission.system.com
lab_id = PROTEOMICS

[retain]
daily = 7
weekly = 4
monthly = 2

[permissions]
; Ownership/permission enforcement on the canonical + views trees so lab users
; (SMB clients) can write inside their own project but can't delete project
; directories or the structure above them. Leave `group` blank to disable.
; lab group that should own submitted data (must exist on the build host)
group =
; service user that should own the tree. Blank = leave owner as the build user.
; chown to a *different* user requires running --enforce-permissions as root.
owner =