[paths]
; where <year>/<month>/<ID> lives
canonical_root = /data/projects
; top-level view container
views_root = /data/views
; version folder name
submissions_db_directory = /data/.submissions_db
date_format = %%Y_%%m_%%d
; per-run log file (inside version dir)
log_name = build.log
; per-run error log (inside version dir)
error_log = error.log  
; share subdirectory - if not blank, create in canonical directory, write README.md inside, and use for path when sharing data
share_subdirectory = share  

[api]
api_key = API_KEY_HERE
api_base_url = my.submission.system.com
lab_id = PROTEOMICS

[retain]
daily = 7
weekly = 4
monthly = 2

[permissions]
; Ownership/permission enforcement on the canonical + views trees so lab users
; (SMB clients) can write inside their own project but can't delete project
; directories or the structure above them. Leave `group` blank to disable.
; lab group that should own submitted data (must exist on the build host)
group =
; service user that should own the tree. Blank = leave owner as the build user.
; chown to a *different* user requires running --enforce-permissions as root.
owner =