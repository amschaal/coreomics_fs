; config.override.example.ini
;
; Deployer-controlled OVERRIDE config. Copy to `config.override.ini` (in the
; package install directory, or wherever $CONFIG_OVERRIDE_PATH points) to lock
; specific keys so a user's own config (e.g. ~/.config/coreomics/config.ini)
; cannot change them.
;
; Values here are layered ON TOP OF the base config, per key: only the keys you
; list below are overridden — everything else still comes from the base config.
; When an override changes a value the user set, the tool prints a one-line
; notice to stderr so they understand why their setting was ignored.
;
; This is a safeguard against user error, not a security boundary: it relies on
; the override file living somewhere users can't edit (e.g. an admin-owned
; package install directory). Ship only this `.example`; the real
; `config.override.ini` is git-ignored.
;
; Typical use — pin the canonical and views directories so they can't be moved:

[paths]
canonical_root = /path/to/coreomics/projects
views_root = /path/to/coreomics/views
windows_views_root = /path/to/coreomics/windows
