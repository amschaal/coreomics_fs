[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "coreomics-fs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "argcomplete",
]

[project.optional-dependencies]
# Needed only to build the optional Windows .lnk views tree
# ([paths] windows_views_root). Install with: pip install 'coreomics-fs[windows]'
windows = [
    "pylnk3>=0.4.2",
]

[project.scripts]
coreomics = "coreomics_fs.cli.project_cli:main"
coreomics-build = "coreomics_fs.build.build_views:main"
coreomics-fetch = "coreomics_fs.build.fetch_projects:main"
coreomics-nav = "coreomics_fs.cli.navigate:main"

[tool.setuptools.packages.find]
where = ["src"]
