# config.yaml
canonical_root: /data/simplified/projects          # where <year>/<month>/<ID> lives
views_root:      /data/simplified/views            # top‑level view container
date_format:    "%Y_%m_%d"             # version folder name
log_name:       build.log              # per‑run log file (inside version dir)
error_log:       error.log              # per‑run error log (inside version dir)
api_key:        API_KEY_HERE
api_base_url:       my.submission.system.com
retain:
  daily:   7      # keep the last 7 daily builds
  weekly:  4      # keep the last 4 weekly builds
  monthly: 2     # keep the last 12 monthly builds